<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243328" />
      <stop offset="50%" stop-color="#3f5039" />
      <stop offset="100%" stop-color="#596b52" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0b7" />
      <stop offset="100%" stop-color="#c49b62" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Inner Soft Glow Outline -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Abstract Finance / Wallet Shield Motif -->
  <g transform="translate(116, 116)">
    <!-- Base geometric wallet shield -->
    <path d="M40 70 C40 45, 60 25, 85 25 L215 25 C235 25, 250 40, 250 60 L250 200 C250 225, 230 245, 205 245 L75 245 C50 245, 40 230, 40 210 Z" fill="rgba(255,255,255,0.06)" />
    
    <!-- Primary Growth Arc -->
    <path d="M60 190 C85 130, 140 85, 210 75" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Rupee / K hybrid accent stroke -->
    <path d="M125 55 L125 215" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
    <path d="M125 135 L200 65" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <path d="M150 115 L215 195" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

    <!-- Coin / Accent Dot -->
    <circle cx="215" cy="65" r="16" fill="url(#goldGrad)" />
  </g>
</svg>
